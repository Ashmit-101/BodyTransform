<h2 class="sr-only">Strobe Lock alignment screen interactive prototype — phone mockup showing a glowing border that transitions from red to green as body joints lock into position</h2>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne+Mono&display=swap');
.phone-wrap{background:var(--color-background-secondary);border-radius:var(--border-radius-xl);padding:28px;border:0.5px solid var(--color-border-tertiary);display:inline-block}
.phone{width:230px;height:468px;background:#101012;border-radius:40px;padding:3px;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,0.07)}
.phone::before{content:'';position:absolute;left:-3px;top:80px;width:3px;height:24px;background:#1c1c1e;border-radius:2px 0 0 2px;box-shadow:0 36px 0 #1c1c1e,0 68px 0 #1c1c1e}
.phone::after{content:'';position:absolute;right:-3px;top:110px;width:3px;height:48px;background:#1c1c1e;border-radius:0 2px 2px 0}
.screen{width:100%;height:100%;border-radius:37px;overflow:hidden;background:#0a0a0d;position:relative}
.cam{position:absolute;inset:0;background:#0d0d10}
.cam::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,0.006) 3px,rgba(255,255,255,0.006) 4px)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:80px;height:22px;background:#000;border-radius:11px;z-index:50;display:flex;align-items:center;justify-content:center;gap:5px}
.island-c{width:8px;height:8px;border-radius:50%;background:#181818;box-shadow:0 0 0 1px rgba(255,255,255,0.05)}
.island-b{width:28px;height:3.5px;background:#181818;border-radius:2px}
.bglow{position:absolute;inset:0;border-radius:37px;z-index:30;pointer-events:none;border:2px solid rgba(255,255,255,0.15);transition:border-color .45s cubic-bezier(.4,0,.2,1),box-shadow .45s cubic-bezier(.4,0,.2,1)}
.slbl{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:35;font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:.28em;padding:4px 11px;border-radius:4px;white-space:nowrap;transition:color .4s,background .4s,border-color .4s;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.4)}
.skel{position:absolute;inset:0;z-index:20;width:100%;height:100%}
.jcount{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:35;text-align:center}
.jnum{font-family:'Bebas Neue',sans-serif;font-size:26px;color:white;line-height:1;letter-spacing:.04em;transition:color .4s}
.jlbl{font-family:'Syne Mono',monospace;font-size:7px;letter-spacing:.22em;color:rgba(255,255,255,0.22);margin-top:2px}
.hwrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:28;width:70px;height:70px;opacity:0;transition:opacity .3s}
.hwrap.show{opacity:1}
.hsvg{width:100%;height:100%;transform:rotate(-90deg)}
.htrack{fill:none;stroke:rgba(255,255,255,0.07);stroke-width:2}
.harc{fill:none;stroke:#32D74B;stroke-width:2;stroke-linecap:round;stroke-dasharray:175.9;stroke-dashoffset:175.9;transition:stroke-dashoffset .04s linear}
.hcheck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#32D74B;transform:rotate(90deg);font-family:sans-serif}
.flash{position:absolute;inset:0;background:white;opacity:0;z-index:60;pointer-events:none;border-radius:37px}
@keyframes bpulse{0%,100%{opacity:1}50%{opacity:.55}}
.pulsing{animation:bpulse 1.7s ease-in-out infinite}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--color-border-tertiary);transition:background .3s,transform .3s}
.sdot.cur{transform:scale(1.6)}
</style>

<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:1.5rem 0">
  <div class="phone-wrap">
    <div class="phone">
      <div class="screen">
        <div class="cam"></div>
        <div class="island"><div class="island-c"></div><div class="island-b"></div></div>
        <div class="bglow" id="bg"></div>
        <div class="slbl" id="sl">NO SIGNAL</div>
        <svg class="skel" id="sk" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
          <g id="cg"></g><g id="jg"></g>
        </svg>
        <div class="hwrap" id="hw">
          <svg class="hsvg" viewBox="0 0 70 70"><circle class="htrack" cx="35" cy="35" r="28"/><circle class="harc" id="ha" cx="35" cy="35" r="28"/></svg>
          <div class="hcheck">✓</div>
        </div>
        <div class="jcount"><div class="jnum" id="jn">0 / 14</div><div class="jlbl">JOINTS LOCKED</div></div>
        <div class="flash" id="fl"></div>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:6px" id="dots">
    <div class="sdot" data-s="none"></div>
    <div style="width:10px;height:1px;background:var(--color-border-tertiary)"></div>
    <div class="sdot" data-s="off"></div>
    <div style="width:10px;height:1px;background:var(--color-border-tertiary)"></div>
    <div class="sdot" data-s="close"></div>
    <div style="width:10px;height:1px;background:var(--color-border-tertiary)"></div>
    <div class="sdot" data-s="almost"></div>
    <div style="width:10px;height:1px;background:var(--color-border-tertiary)"></div>
    <div class="sdot" data-s="locked"></div>
  </div>

  <div style="width:260px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:12px;color:var(--color-text-secondary);font-family:'Syne Mono',monospace;letter-spacing:.1em;white-space:nowrap">ALIGNMENT</span>
      <input type="range" id="sl2" min="0" max="100" value="0" step="1" style="flex:1">
      <span style="font-size:12px;font-weight:500;min-width:32px;color:var(--color-text-primary)" id="pct">0%</span>
    </div>
    <div style="display:flex;gap:8px">
      <button id="bAuto" onclick="toggleAuto()" style="flex:1;font-size:11px;letter-spacing:.12em;font-family:'Syne Mono',monospace">AUTO DEMO</button>
      <button onclick="doReset()" style="font-size:11px;letter-spacing:.12em;font-family:'Syne Mono',monospace">RESET</button>
    </div>
  </div>
</div>

<script>
const JOINTS=[
  {id:'head',x:50,y:13,r:7},{id:'neck',x:50,y:22,r:3.5},
  {id:'ls',x:30,y:27,r:5},{id:'rs',x:70,y:27,r:5},
  {id:'le',x:21,y:42,r:4},{id:'re',x:79,y:42,r:4},
  {id:'lw',x:16,y:55,r:3.5},{id:'rw',x:84,y:55,r:3.5},
  {id:'lh',x:38,y:55,r:4.5},{id:'rh',x:62,y:55,r:4.5},
  {id:'lk',x:35,y:71,r:4},{id:'rk',x:65,y:71,r:4},
  {id:'la',x:33,y:86,r:3.5},{id:'ra',x:67,y:86,r:3.5}
];
const CONNS=[['head','neck'],['neck','ls'],['neck','rs'],['ls','rs'],['ls','le'],['rs','re'],['le','lw'],['re','rw'],['ls','lh'],['rs','rh'],['lh','rh'],['lh','lk'],['rh','rk'],['lk','la'],['rk','ra']];
const LOCK_ORD=['neck','head','ls','rs','lh','rh','le','re','lk','rk','lw','rw','la','ra'];
const C={none:'rgba(255,255,255,0.22)',off:'#FF3A30',close:'#FF9500',almost:'#FFD60A',locked:'#32D74B'};
const GLOWS={
  none:'0 0 4px rgba(255,255,255,0.06),inset 0 0 8px rgba(255,255,255,0.02)',
  off:'0 0 8px 2px #FF3A30,0 0 24px 4px rgba(255,58,48,0.55),0 0 52px 6px rgba(255,58,48,0.2),inset 0 0 18px rgba(255,58,48,0.09)',
  close:'0 0 8px 2px #FF9500,0 0 24px 4px rgba(255,149,0,0.55),0 0 52px 6px rgba(255,149,0,0.2),inset 0 0 18px rgba(255,149,0,0.09)',
  almost:'0 0 8px 2px #FFD60A,0 0 24px 4px rgba(255,214,10,0.55),0 0 52px 6px rgba(255,214,10,0.2),inset 0 0 18px rgba(255,214,10,0.09)',
  locked:'0 0 10px 3px #32D74B,0 0 28px 5px rgba(50,215,75,0.65),0 0 60px 8px rgba(50,215,75,0.28),inset 0 0 20px rgba(50,215,75,0.1)'
};
const LABELS={none:'NO SIGNAL',off:'MISALIGNED',close:'GETTING CLOSE',almost:'ALMOST THERE',locked:'LOCKED IN'};
const LBL_STYLES={
  none:{color:'rgba(255,255,255,0.35)',bg:'rgba(255,255,255,0.06)',bd:'rgba(255,255,255,0.12)'},
  off:{color:'#FF3A30',bg:'rgba(255,58,48,0.1)',bd:'rgba(255,58,48,0.3)'},
  close:{color:'#FF9500',bg:'rgba(255,149,0,0.1)',bd:'rgba(255,149,0,0.3)'},
  almost:{color:'#FFD60A',bg:'rgba(255,214,10,0.1)',bd:'rgba(255,214,10,0.3)'},
  locked:{color:'#32D74B',bg:'rgba(50,215,75,0.1)',bd:'rgba(50,215,75,0.3)'}
};
const CIRC=175.9;
function getState(p){return p<10?'none':p<40?'off':p<65?'close':p<88?'almost':'locked'}

(function init(){
  const cg=document.getElementById('cg'),jg=document.getElementById('jg');
  const ns='http://www.w3.org/2000/svg';
  CONNS.forEach(([a,b])=>{
    const jA=JOINTS.find(j=>j.id===a),jB=JOINTS.find(j=>j.id===b);
    const l=document.createElementNS(ns,'line');
    l.setAttribute('x1',jA.x);l.setAttribute('y1',jA.y);
    l.setAttribute('x2',jB.x);l.setAttribute('y2',jB.y);
    l.setAttribute('stroke','rgba(255,255,255,0.09)');l.setAttribute('stroke-width','0.7');
    l.setAttribute('id','c-'+a+'-'+b);l.style.transition='stroke .35s,stroke-width .35s';
    cg.appendChild(l);
  });
  JOINTS.forEach(j=>{
    const r=j.r||4,gw=document.createElementNS(ns,'circle'),c=document.createElementNS(ns,'circle');
    gw.setAttribute('cx',j.x);gw.setAttribute('cy',j.y);gw.setAttribute('r',r*2.4);
    gw.setAttribute('fill','transparent');gw.setAttribute('id','gw-'+j.id);
    gw.style.transition='fill .35s';jg.appendChild(gw);
    c.setAttribute('cx',j.x);c.setAttribute('cy',j.y);c.setAttribute('r',r);
    c.setAttribute('fill','rgba(255,255,255,0.12)');c.setAttribute('id','j-'+j.id);
    c.style.transition='fill .35s';jg.appendChild(c);
  });
})();

function updateUI(pct,holdPct){
  const st=getState(pct),col=C[st];
  const lockedN=Math.floor((pct/100)*LOCK_ORD.length);
  const locked=new Set(LOCK_ORD.slice(0,lockedN));
  const bg=document.getElementById('bg');
  bg.style.borderColor=col;bg.style.boxShadow=GLOWS[st];
  st==='off'?bg.classList.add('pulsing'):bg.classList.remove('pulsing');
  const sl=document.getElementById('sl'),ls=LBL_STYLES[st];
  sl.textContent=LABELS[st];sl.style.color=ls.color;
  sl.style.background=ls.bg;sl.style.borderColor=ls.bd;
  const jn=document.getElementById('jn');
  jn.textContent=lockedN+' / '+LOCK_ORD.length;
  jn.style.color=st==='locked'?C.locked:'white';
  JOINTS.forEach(j=>{
    const jEl=document.getElementById('j-'+j.id),gwEl=document.getElementById('gw-'+j.id);
    const isL=locked.has(j.id);
    jEl.setAttribute('fill',isL?C.locked:st==='none'?'rgba(255,255,255,0.08)':
      st==='off'?'rgba(255,58,48,0.85)':st==='close'?'rgba(255,149,0,0.85)':'rgba(255,214,10,0.85)');
    gwEl.setAttribute('fill',isL?'rgba(50,215,75,0.18)':'transparent');
  });
  CONNS.forEach(([a,b])=>{
    const l=document.getElementById('c-'+a+'-'+b),bl=locked.has(a)&&locked.has(b);
    l.setAttribute('stroke',bl?'rgba(50,215,75,0.55)':'rgba(255,255,255,0.08)');
    l.setAttribute('stroke-width',bl?'1':'0.6');
  });
  const hw=document.getElementById('hw'),ha=document.getElementById('ha');
  if(st==='locked'&&holdPct>0){hw.classList.add('show');ha.style.strokeDashoffset=CIRC*(1-holdPct/100);}
  else{hw.classList.remove('show');ha.style.strokeDashoffset=CIRC;}
  const stOrd=['none','off','close','almost','locked'],stI=stOrd.indexOf(st);
  document.querySelectorAll('.sdot').forEach((d,i)=>{
    d.className='sdot';
    if(i<=stI)d.classList.add('s-'+stOrd[i]);
    if(i===stI)d.classList.add('cur');
  });
  document.getElementById('sl2').value=Math.round(pct);
  document.getElementById('pct').textContent=Math.round(pct)+'%';
}

function doFlash(){
  const fl=document.getElementById('fl');
  fl.style.transition='none';fl.style.opacity='1';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fl.style.transition='opacity .65s ease';fl.style.opacity='0';}));
}

let isAuto=true,raf=null,lastT=0,autoPct=0,autoHold=0,phase='lock';
function runAuto(ts){
  if(!isAuto)return;
  const dt=Math.min(ts-lastT,50);lastT=ts;
  if(phase==='lock'){
    autoPct+=0.13*(dt/16);updateUI(autoPct,0);
    if(autoPct>=100){autoPct=100;phase='hold';autoHold=0;}
  }else if(phase==='hold'){
    autoHold+=0.21*(dt/16);updateUI(100,autoHold);
    if(autoHold>=100){phase='flash';}
  }else if(phase==='flash'){
    doFlash();phase='reset';updateUI(100,100);
  }else{
    autoPct-=0.35*(dt/16);
    updateUI(Math.max(0,autoPct),0);
    if(autoPct<=0){autoPct=0;phase='lock';}
  }
  raf=requestAnimationFrame(runAuto);
}
function toggleAuto(){
  isAuto=!isAuto;
  const b=document.getElementById('bAuto');
  if(isAuto){b.style.background='var(--color-background-success)';b.style.color='var(--color-text-success)';b.style.borderColor='var(--color-border-success)';lastT=performance.now();raf=requestAnimationFrame(runAuto);}
  else{b.style.background='';b.style.color='';b.style.borderColor='';if(raf)cancelAnimationFrame(raf);}
}
function doReset(){
  isAuto=false;const b=document.getElementById('bAuto');
  b.style.background='';b.style.color='';b.style.borderColor='';
  if(raf)cancelAnimationFrame(raf);
  autoPct=0;autoHold=0;phase='lock';updateUI(0,0);
}
document.getElementById('sl2').addEventListener('input',function(){
  if(isAuto){isAuto=false;const b=document.getElementById('bAuto');b.style.background='';b.style.color='';b.style.borderColor='';if(raf)cancelAnimationFrame(raf);}
  updateUI(parseFloat(this.value),0);
});
const b=document.getElementById('bAuto');
b.style.background='var(--color-background-success)';b.style.color='var(--color-text-success)';b.style.borderColor='var(--color-border-success)';
updateUI(0,0);lastT=performance.now();raf=requestAnimationFrame(runAuto);
</script>
